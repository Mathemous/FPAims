name: Update Knox County ePlan

on:
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: 'Fiscal year (latest approved Consolidated revision)'
        required: true
        default: '2027'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eplan-source-update
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer
        run: |
          npm ci --prefix scripts/eplan
          cd scripts/eplan
          npx playwright install --with-deps chromium
      - name: Test comparison rules
        run: python -m unittest discover -s scripts/eplan -p 'test_*.py'
      - name: Download all five approved budgets
        env:
          EPLAN_YEAR: ${{ inputs.fiscal_year }}
        run: node scripts/eplan/fetch-eplan.mjs "$RUNNER_TEMP/eplan" "$EPLAN_YEAR"
      - name: Prepare database changes
        run: python scripts/eplan/import_eplan.py "$RUNNER_TEMP/eplan" .
      - name: Validate application
        run: |
          npm ci
          npm test
          npm run build
      - name: Save review report
        run: |
          echo '## Knox County Schools ePlan check' >> "$GITHUB_STEP_SUMMARY"
          echo 'The job downloaded all five programs from the latest approved Consolidated revision for the requested year.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/eplan/report.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare update for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/records.json data/eplan-source.json data/eplan-meta.json data/eplan-update.json; then
            echo '### Up to date' >> "$GITHUB_STEP_SUMMARY"
            echo 'No source changes found. The published database was left unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="codex/eplan-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/records.json data/eplan-source.json data/eplan-meta.json data/eplan-update.json
          git commit -m 'Refresh Knox County Schools ePlan source'
          git push origin "$branch"
          python scripts/eplan/review_body.py "$RUNNER_TEMP/eplan/report.json" "$RUNNER_TEMP/eplan-review.md"
          if gh pr create --base main --head "$branch" --title 'Update Knox County Schools ePlan database' --body-file "$RUNNER_TEMP/eplan-review.md" > "$RUNNER_TEMP/eplan-pr.txt"; then
            printf '\n[Review the proposed update](%s)\n' "$(cat "$RUNNER_TEMP/eplan-pr.txt")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Automatic pull request creation is unavailable. The update branch was saved successfully.' >> "$GITHUB_STEP_SUMMARY"
            printf '\n[Review changes and create a pull request](https://github.com/%s/compare/main...%s?expand=1)\n' "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Review the source and record changes before merging. Merging publishes through the existing Vercel deployment.' >> "$GITHUB_STEP_SUMMARY"
